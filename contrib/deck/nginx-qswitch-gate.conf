# /etc/nginx/qswitch-gateway/gate.conf (location context)
# try_files runs after auth_request; rewrite-phase `if return` checks here
# would disclose routing information before authentication.
auth_request /qswitch/_session_gate;
root /var/empty/qswitch-gateway;
error_page 401 = @qswitch_login_required;
error_page 403 = @qswitch_access_denied;
error_page 500 502 504 =503 @qswitch_auth_unavailable;
