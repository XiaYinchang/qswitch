# /etc/nginx/qswitch-gateway/shell.conf (location context)
rewrite ^/qswitch/(.*)$ /$1 break;
proxy_pass http://127.0.0.1:7432;
proxy_http_version 1.1;
proxy_set_header X-Qswitch-Portal "1";
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Prefix /qswitch;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_next_upstream off;
proxy_read_timeout 120s;
proxy_intercept_errors on;
error_page 502 504 =503 @qswitch_shell_offline;
# Do not override qswitch's CSP or Referrer-Policy on its shell/login pages.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
