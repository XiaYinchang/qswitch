# Include inside the existing TLS server for deck.xiayinchang.top.
# Install the companion snippets in /etc/nginx/qswitch-gateway/. Generate
# instances.conf from nginx-qswitch-instance.conf.in using deployment metadata;
# the three IDs must match each target's /api/health. Never put tokens here.
location = /qswitch { return 308 /qswitch/; }

# Only the canonical shell, login and global APIs use the central session.
location /qswitch/ {
    include /etc/nginx/qswitch-gateway/shell.conf;
}
location = /qswitch/api/health {
    include /etc/nginx/qswitch-gateway/shell.conf;
}
location = /qswitch/api/session {
    include /etc/nginx/qswitch-gateway/shell.conf;
}
location = /qswitch/api/environments {
    include /etc/nginx/qswitch-gateway/shell.conf;
}

# Missing, unknown and incomplete instance paths also authenticate first.
location /qswitch/api/ {
    include /etc/nginx/qswitch-gateway/gate.conf;
    try_files /__qswitch_dispatch_only__ @qswitch_unknown_api;
}
location = /qswitch/api/instances {
    include /etc/nginx/qswitch-gateway/gate.conf;
    try_files /__qswitch_dispatch_only__ @qswitch_unknown_api;
}
include /etc/nginx/qswitch-gateway/instances.conf;

# auth_request makes a GET subrequest with no body or target-specific query.
# Keep central Cookie/Bearer authentication and Origin validation. A loopback
# Host without forwarded identity would accidentally bypass public-page auth.
location = /qswitch/_session_gate {
    internal;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Accept application/json;
    proxy_set_header X-Qswitch-Instance "";
    proxy_set_header X-Qswitch-Portal "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /qswitch;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    rewrite ^ /api/session? break;
    proxy_pass http://127.0.0.1:7432;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
}

location @qswitch_login_required {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Qswitch-Login-Required "1" always;
    return 401 '{"error":"请先登录 qswitch 管理页面"}';
}
location @qswitch_access_denied {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":"请求来源或访问权限无效"}';
}
location @qswitch_auth_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"统一登录服务暂时不可用"}';
}
location @qswitch_unknown_api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"未知环境或接口"}';
}
location @qswitch_target_auth_failed {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"目标环境的服务端认证失败，请检查网关配置"}';
}
location @qswitch_target_redirect {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":"目标环境返回了不受支持的重定向"}';
}
location @qswitch_target_offline {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 503 '{"error":"目标连接中断；已提交的操作结果尚未确认，请刷新状态核对，不要重复提交","result_unknown":true}';
    }
    return 503 '{"error":"目标环境暂时不可达"}';
}
location @qswitch_shell_offline {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"qswitch 管理页面暂时不可达"}';
}

# Retired entry points: do not retain a redirect or a separate login surface.
location = /qswitch-mini { return 404; }
location ^~ /qswitch-mini/ { return 404; }
location = /qswitch-book { return 404; }
location ^~ /qswitch-book/ { return 404; }
