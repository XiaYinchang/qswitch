# Inside server { server_name deck.xiayinchang.top; } in
# /etc/nginx/sites-available/deck on lisa-hk. The page keeps its own login;
# nginx only terminates TLS and names the public host, scheme, mount point and
# client for it. qswitch sends its own Content-Security-Policy (the page has a
# nonce'd inline script), so this location sets the other headers itself:
# an add_header here replaces the server-level ones.
location = /qswitch { return 308 /qswitch/; }
location /qswitch/ {
    proxy_pass http://127.0.0.1:7432/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /qswitch;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;          # a full refresh asks every provider
    proxy_intercept_errors on;
    error_page 502 504 =503 @qswitch_down;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
location @qswitch_down {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 503 "qswitch 页面暂时连不上：novix 的隧道没有接上（systemctl --user status qswitch-tunnel）。\n";
}
