# /etc/nginx/qswitch-gateway/target.conf (named location context)
proxy_http_version 1.1;
proxy_set_header Cookie "";
proxy_set_header X-Qswitch-Portal "";
proxy_set_header X-Qswitch-Instance $http_x_qswitch_instance;
proxy_set_header Origin $http_origin;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Prefix /qswitch;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Authorization is set exactly once by the per-instance root-only include.
proxy_hide_header Set-Cookie;
proxy_hide_header Location;
proxy_hide_header X-Qswitch-Login-Required;
proxy_hide_header X-Accel-Redirect;
proxy_ignore_headers X-Accel-Redirect;
proxy_redirect off;
proxy_next_upstream off;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_intercept_errors on;
error_page 401 = @qswitch_target_auth_failed;
error_page 301 302 303 307 308 =502 @qswitch_target_redirect;
error_page 502 504 =503 @qswitch_target_offline;
add_header Cache-Control "no-store" always;
