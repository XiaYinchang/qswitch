# /etc/ssh/sshd_config.d/20-qswitch-tunnel.conf on lisa-hk.
# Account for novix's qswitch-tunnel.service: key only, no shell, no PTY,
# the one remote forward nginx proxies to. Created with
#   useradd --system --create-home --home-dir /home/qswitch-tunnel --shell /usr/sbin/nologin qswitch-tunnel
# authorized_keys line: restrict,port-forwarding,permitlisten="127.0.0.1:7432" ssh-ed25519 ...
AllowUsers qswitch-tunnel
Match User qswitch-tunnel
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:7432
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
