<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>qswitch</title>
    <!-- qswitch-icons -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #10141c;
        --surface: #161c27;
        --raised: #1b2330;
        --line: #2a3547;
        --text: #e6edf7;
        --muted: #98a7bd;
        --accent: #83afff;
        --accent-bg: #213654;
        --ok: #75d6ae;
        --warn: #efc276;
        --bad: #ff9aa5;
        --shadow: 0 20px 80px #0006;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f4f6fa;
          --surface: #fff;
          --raised: #f0f3f8;
          --line: #dce3ee;
          --text: #202d40;
          --muted: #5d6c81;
          --accent: #245fbd;
          --accent-bg: #e7efff;
          --ok: #167b56;
          --warn: #855a12;
          --bad: #b63148;
          --shadow: 0 20px 80px #24385824;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "PingFang SC",
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button,
      a,
      input,
      summary {
        touch-action: manipulation;
      }
      button,
      a,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        color: var(--text);
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent-bg);
        border-color: var(--accent);
        color: var(--accent);
      }
      button.ghost {
        background: transparent;
      }
      button.danger {
        color: var(--bad);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      input {
        min-width: 0;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        color: var(--text);
        background: var(--bg);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
        letter-spacing: -0.025em;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 14px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      .skip {
        position: fixed;
        top: -60px;
        left: 12px;
        z-index: 30;
        padding: 10px;
        background: var(--surface);
      }
      .skip:focus {
        top: 10px;
      }
      .topbar {
        min-height: 68px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .brand {
        display: flex;
        gap: 9px;
        align-items: center;
        color: var(--text);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.04em;
        flex-shrink: 0;
      }
      .brand img {
        width: 30px;
        height: 30px;
      }
      .environments {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .environment {
        padding: 5px 10px;
        border-radius: 7px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .environment[aria-current="page"] {
        color: var(--text);
        background: var(--raised);
        font-weight: 600;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
        flex-shrink: 0;
      }
      .connection {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .connection::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
      }
      .connection.online::before {
        background: var(--ok);
      }
      .connection.offline::before {
        background: var(--bad);
      }
      #logoutForm {
        margin: 0;
      }
      .layout {
        display: grid;
        grid-template-columns: 196px minmax(0, 1fr);
        min-height: calc(100vh - 69px);
      }
      .sidebar {
        padding: 22px 14px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: var(--surface);
      }
      .nav-caption {
        font-size: 11px;
        color: var(--muted);
        padding: 0 10px 8px;
        letter-spacing: 0.08em;
      }
      .tool-nav {
        display: grid;
        gap: 4px;
      }
      .nav-add {
        margin-top: 10px;
        width: 100%;
      }
      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 11px;
        border-radius: 8px;
        color: var(--muted);
        min-height: 42px;
      }
      .nav-item:hover {
        text-decoration: none;
        background: var(--raised);
      }
      .nav-item[aria-current="page"] {
        color: var(--accent);
        background: var(--accent-bg);
      }
      .nav-count {
        font-size: 11px;
        background: var(--bg);
        border-radius: 5px;
        min-width: 20px;
        text-align: center;
        padding: 1px 5px;
      }
      .sidebar-bottom {
        margin-top: auto;
        display: grid;
        gap: 10px;
      }
      .instance-meta {
        font-size: 11px;
        color: var(--muted);
        padding: 0 11px;
        overflow-wrap: anywhere;
      }
      .main {
        min-width: 0;
        padding: 28px 30px 40px;
        max-width: 1500px;
        width: 100%;
        margin: 0 auto;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }
      .heading-meta {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .notice {
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        margin-bottom: 16px;
        overflow-wrap: anywhere;
      }
      .notice:empty {
        display: none;
      }
      .notice.error {
        border-color: var(--bad);
        color: var(--bad);
      }
      .notice.warn {
        color: var(--warn);
      }
      .tool-status {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 18px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 7px;
        font-size: 11px;
        color: var(--muted);
        white-space: normal;
      }
      .pill.current {
        color: var(--accent);
        background: var(--accent-bg);
        border-color: transparent;
      }
      .pill.ok {
        color: var(--ok);
      }
      .pill.warn {
        color: var(--warn);
      }
      .pill.error {
        color: var(--bad);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(220px, 29%) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .account-list {
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .account-row {
        width: 100%;
        text-align: left;
        min-width: 0;
        padding: 13px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .account-row[aria-current="true"] {
        border-color: var(--accent);
        background: var(--accent-bg);
      }
      .account-name {
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .account-row-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 11px;
      }
      .account-detail {
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px;
      }
      .mobile-back {
        display: none;
        margin-bottom: 14px;
      }
      .detail-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }
      .identity {
        min-width: 0;
      }
      .identity h2 {
        overflow-wrap: anywhere;
        line-height: 1.4;
      }
      .identity-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .detail-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: start;
        margin-bottom: 20px;
      }
      .more {
        position: relative;
      }
      .more > summary {
        list-style: none;
        min-height: 36px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        color: var(--muted);
      }
      .more > summary::-webkit-details-marker {
        display: none;
      }
      .more-menu {
        position: absolute;
        z-index: 3;
        right: 0;
        top: calc(100% + 5px);
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        box-shadow: var(--shadow);
        min-width: 140px;
      }
      .more-menu button {
        width: 100%;
        text-align: left;
        border: 0;
      }
      .quota-groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .quota-group {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .quota-group header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .quota-list {
        display: grid;
        gap: 16px;
      }
      .quota-row {
        min-width: 0;
      }
      .quota-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
      }
      .quota-label span:first-child {
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .quota-value {
        white-space: nowrap;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 6px;
        background: var(--raised);
        border-radius: 8px;
        margin: 7px 0;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 8px;
        background: var(--ok);
      }
      .bar.empty {
        background: repeating-linear-gradient(
          135deg,
          var(--raised),
          var(--raised) 4px,
          var(--bg) 4px,
          var(--bg) 8px
        );
      }
      .reset-time {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }
      .quota-note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 14px;
        overflow-wrap: anywhere;
      }
      .rule {
        font-size: 12px;
        color: var(--muted);
        margin-top: 14px;
      }
      .rule strong {
        color: var(--text);
        font-weight: 500;
      }
      .details {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 20px;
      }
      .details > summary {
        cursor: pointer;
        color: var(--muted);
        min-height: 30px;
        font-size: 12px;
      }
      .details-content {
        padding-top: 10px;
        display: grid;
        gap: 12px;
      }
      .facts {
        display: grid;
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 9px 12px;
        font-size: 12px;
        margin: 0;
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .empty {
        padding: 32px 24px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        display: grid;
        gap: 12px;
        justify-items: start;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .empty strong {
        color: var(--text);
        font-weight: 500;
      }
      .tool-settings {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .tool-settings > summary {
        cursor: pointer;
        font-size: 13px;
        min-height: 32px;
        color: var(--muted);
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 12px 0;
      }
      .setting-copy {
        min-width: 0;
      }
      .setting-copy p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .switch {
        min-width: 72px;
        flex-shrink: 0;
      }
      .switch[aria-checked="true"] {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-bg);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow-wrap: anywhere;
        font-size: 12px;
      }
      pre {
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        padding: 14px;
        border-radius: 8px;
        margin: 0;
      }
      .command {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--raised);
        width: 100%;
        min-width: 0;
      }
      .command code {
        min-width: 0;
      }
      .capability-note {
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .env-intro {
        font-size: 13px;
        color: var(--muted);
        margin: 6px 0 22px;
      }
      .environment-rows {
        display: grid;
        gap: 12px;
      }
      .environment-row {
        display: grid;
        grid-template-columns:
          160px minmax(180px, 1fr) minmax(160px, 0.7fr)
          auto;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        align-items: end;
      }
      .field {
        display: grid;
        gap: 6px;
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .form-actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
      }
      .environment-row button {
        min-height: 40px;
      }
      .settings-page {
        max-width: 980px;
      }
      .diagnostics {
        margin-top: 18px;
      }
      .status-line {
        font-size: 12px;
        color: var(--muted);
        margin: 12px 0;
      }
      .icon-label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        padding: 24px;
        width: min(460px, calc(100vw - 28px));
        max-height: calc(100dvh - 36px);
        overflow: auto;
      }
      .dialog::backdrop {
        background: #060b16a6;
        backdrop-filter: blur(3px);
      }
      .dialog h2 {
        margin-bottom: 10px;
      }
      .dialog p {
        font-size: 13px;
        color: var(--muted);
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .dialog .actions {
        justify-content: flex-end;
        margin-top: 20px;
      }
      #addAccountGuidance {
        margin-top: 16px;
      }
      #addTool {
        width: 100%;
        min-height: 42px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        color: var(--text);
        font: inherit;
      }
      .device-code-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 18px 0;
      }
      .device-code {
        font:
          24px/1.4 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        letter-spacing: 0.07em;
        padding: 11px 13px;
        background: var(--raised);
        border-radius: 9px;
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
        user-select: all;
      }
      .dialog .dialog-status {
        color: var(--text);
        min-height: 1.5em;
      }
      .dialog .dialog-status.error {
        color: var(--bad);
      }
      .dialog .dialog-status.ok {
        color: var(--ok);
      }
      .dialog a.button-link {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--accent-bg);
        border: 1px solid var(--accent);
      }
      .confirm-impact {
        padding: 12px;
        background: var(--raised);
        border-radius: 8px;
      }
      .confirm-target {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (min-width: 1500px) {
        .main {
          padding-top: 34px;
        }
        .workspace {
          grid-template-columns: 290px minmax(0, 1fr);
        }
      }
      @media (max-width: 1100px) {
        .topbar {
          gap: 12px;
          padding: 12px 18px;
        }
        .top-actions {
          gap: 8px;
        }
        .layout {
          grid-template-columns: 168px minmax(0, 1fr);
        }
        .sidebar {
          padding: 18px 10px;
        }
        .main {
          padding: 22px 20px;
        }
        .workspace {
          grid-template-columns: 215px minmax(0, 1fr);
          gap: 12px;
        }
        .account-detail {
          padding: 18px;
        }
        .quota-groups {
          grid-template-columns: 1fr;
        }
        .environment-row {
          grid-template-columns: 1fr 1fr;
        }
        .environment-row .field:nth-child(2) {
          grid-column: 2;
        }
        .environment-row button {
          justify-self: end;
        }
        .connection {
          font-size: 11px;
        }
      }
      @media (max-width: 760px) {
        .topbar {
          padding: 12px 16px;
          gap: 12px;
          flex-wrap: wrap;
        }
        .brand {
          font-size: 18px;
        }
        .brand img {
          width: 27px;
          height: 27px;
        }
        .top-actions {
          margin-left: auto;
          gap: 8px;
        }
        .connection {
          max-width: 90px;
        }
        .environments {
          order: 3;
          flex-basis: 100%;
          gap: 3px;
        }
        .environment {
          padding: 4px 9px;
          font-size: 12px;
        }
        .layout {
          display: block;
          min-height: 0;
        }
        .sidebar {
          display: block;
          padding: 10px 12px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .nav-caption,
        .instance-meta {
          display: none;
        }
        .tool-nav {
          display: flex;
          overflow: auto;
          gap: 4px;
          scrollbar-width: thin;
          padding: 2px 0;
        }
        .nav-item {
          flex-shrink: 0;
          white-space: nowrap;
          min-height: 40px;
          padding: 8px 10px;
          font-size: 12px;
        }
        .nav-add {
          width: auto;
          margin-top: 8px;
        }
        .sidebar-bottom {
          margin-top: 8px;
        }
        .sidebar-bottom .nav-item {
          display: inline-flex;
          width: max-content;
        }
        .main {
          padding: 20px 16px 32px;
        }
        .page-heading {
          gap: 12px;
          flex-wrap: wrap;
          margin-bottom: 16px;
        }
        h1 {
          font-size: 19px;
        }
        .page-heading > .actions {
          width: 100%;
        }
        .workspace {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
        .account-list {
          max-height: 260px;
          overflow-y: auto;
          padding: 1px;
        }
        .account-row {
          padding: 12px;
        }
        .account-name {
          font-size: 13px;
        }
        .account-row-meta {
          margin-top: 5px;
        }
        .account-detail {
          padding: 17px;
          scroll-margin-top: 12px;
        }
        .mobile-back {
          display: inline-flex;
        }
        .quota-groups {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .quota-group {
          padding: 12px;
        }
        .quota-label {
          gap: 7px;
          font-size: 11px;
        }
        .quota-group h3 {
          font-size: 13px;
        }
        .detail-actions {
          gap: 7px;
        }
        .facts {
          grid-template-columns: 76px minmax(0, 1fr);
        }
        button {
          min-height: 40px;
        }
        .actions button,
        .more > summary {
          min-height: 44px;
        }
        .environment-row {
          grid-template-columns: minmax(0, 1fr);
          padding: 14px;
        }
        .environment-row .field:nth-child(2) {
          grid-column: auto;
        }
        .environment-row button {
          justify-self: start;
        }
        .dialog {
          padding: 22px 18px;
        }
        .top-actions button {
          font-size: 12px;
          padding: 7px 9px;
        }
        .setting-copy {
          font-size: 13px;
        }
      }
      @media (max-width: 420px) {
        .quota-groups {
          grid-template-columns: minmax(0, 1fr);
        }
        .quota-group .quota-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
        .quota-group header {
          margin-bottom: 12px;
        }
        .detail-heading {
          flex-wrap: wrap;
        }
        .connection {
          display: none;
        }
        .topbar {
          column-gap: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">跳到账号管理</a>
    <header class="topbar">
      <a class="brand" href="#" aria-label="qswitch 首页"
        ><img src="favicon.svg" alt="" width="30" height="30" />qswitch</a
      >
      <nav class="environments" id="environmentNav" aria-label="环境"></nav>
      <div class="top-actions">
        <span class="connection" id="connection" role="status">正在连接</span
        ><button
          class="ghost"
          data-act="refresh-state"
          data-focus="refresh-state"
        >
          刷新状态
        </button>
        <form method="post" action="logout" id="logoutForm" hidden>
          <button class="ghost" type="submit">退出</button>
        </form>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div>
          <p class="nav-caption">账号管理</p>
          <nav class="tool-nav" id="toolNav" aria-label="工具"></nav>
          <button
            class="ghost nav-add"
            id="addAccount"
            data-act="add-account"
            data-focus="add-account"
            disabled
          >
            ＋ 添加账号
          </button>
        </div>
        <div class="sidebar-bottom">
          <a
            class="nav-item"
            href="#environments"
            data-view="environments"
            data-focus="environment-settings"
            >环境管理</a
          >
          <div class="instance-meta" id="instanceMeta"></div>
        </div>
      </aside>
      <main class="main" id="main" tabindex="-1">
        <div id="globalNotice" class="notice" role="alert" hidden></div>
        <div id="root"></div>
      </main>
    </div>
    <dialog
      class="dialog"
      id="loginDlg"
      aria-labelledby="loginTitle"
      aria-describedby="loginHint"
    >
      <h2 id="loginTitle">添加账号</h2>
      <p id="loginHint"></p>
      <div id="loginPicker" hidden>
        <label class="field" for="addTool"
          >工具<select id="addTool" data-focus="add-tool"></select
        ></label>
        <div id="addAccountGuidance"></div>
      </div>
      <div id="loginAuthorization">
        <div class="device-code-row">
          <output id="loginCode" class="device-code" aria-label="一次性授权代码"
            >…</output
          ><button id="copyLoginCode" data-act="copy-code" disabled>
            复制
          </button>
        </div>
        <a
          id="loginUrl"
          class="button-link"
          target="_blank"
          rel="noopener noreferrer"
          hidden
          >打开官方授权页 ↗</a
        >
        <p id="loginExpiry"></p>
      </div>
      <p
        id="loginMsg"
        class="dialog-status"
        role="status"
        aria-live="polite"
      ></p>
      <div class="actions">
        <button id="loginRetry" data-act="retry-login" hidden>
          重新获取代码</button
        ><button id="loginCancel" data-act="cancel-login">取消</button>
      </div>
    </dialog>
    <dialog
      class="dialog"
      id="confirmDlg"
      aria-labelledby="confirmTitle"
      aria-describedby="confirmImpact"
    >
      <h2 id="confirmTitle"></h2>
      <div class="confirm-target" id="confirmTarget"></div>
      <p id="confirmImpact" class="confirm-impact"></p>
      <p id="confirmInstance"></p>
      <div class="actions">
        <button data-act="cancel-confirm" id="confirmCancel">取消</button
        ><button data-act="accept-confirm" id="confirmAccept" class="primary">
          确认
        </button>
      </div>
    </dialog>
    <script>
      // qswitch-ui-start
      const $ = (id) => document.getElementById(id);
      const state = {
        instance: null,
        expected:
          new URL(location.href).searchParams.get("expected_instance") || "",
        trustedID: "",
        online: false,
        fatal: "",
        overview: null,
        view: "",
        selected: new Map(),
        operations: new Map(),
        messages: new Map(),
        revision: 0,
        readSequence: 0,
        readController: null,
        environments: [],
        envDirty: false,
        envDraft: [],
        lastRead: 0,
        connectionError: "",
        environmentsError: "",
        environmentsMessage: null,
      };
      const ui = {
        accountNodes: new Map(),
        navNodes: new Map(),
        tool: "",
        overviewTimer: null,
        confirm: null,
        login: {
          mode: "device",
          generation: 0,
          id: "",
          tool: "",
          timer: null,
          expires: 0,
          opener: null,
          polling: false,
        },
      };
      const toolNames = {
        codex: "ChatGPT / Codex",
        grok: "Grok",
        cursor: "Cursor",
        grokbot: "Grok Bot",
        devin: "Devin CLI",
        zcode: "ZCode 订阅",
        kimi: "Kimi Code",
        claude: "Claude Code",
        antigravity: "Antigravity",
      };
      const classNames = {
        ok: "可用",
        soft: "接近用尽",
        exhausted: "已耗尽",
        expired: "需要重新登录",
        unknown: "额度未知",
      };
      const antigravityBucketIDs = [
        "gemini_5h",
        "gemini_weekly",
        "third_party_5h",
        "third_party_weekly",
      ];
      const attr = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const toolTitle = (tool) => toolNames[tool] || tool;
      const actionTool = (tool) => (tool === "grokbot" ? "cursor" : tool);
      const toolView = (tool) =>
        (state.overview?.tools || []).find((t) => t.tool === tool);
      const capability = (tool, key) =>
        tool?.capabilities?.[key] || {
          available: false,
          reason: "当前服务未提供此能力",
        };
      const visibleTools = () =>
        (state.overview?.tools || []).filter(
          (tool) => (tool.accounts || []).length > 0,
        );
      const addableTools = () => {
        const managed = new Set(state.instance?.managed_tools || []);
        return (state.overview?.tools || []).filter(
          (tool) =>
            managed.has(tool.tool) &&
            !tool.derived_from &&
            tool.tool !== "grokbot",
        );
      };
      function normalizedView(requested) {
        if (requested === "environments") return requested;
        const tools = visibleTools();
        return tools.some((tool) => tool.tool === requested)
          ? requested
          : tools[0]?.tool || "";
      }
      function hashView() {
        try {
          return decodeURIComponent(location.hash.slice(1));
        } catch {
          return "";
        }
      }
      function replaceViewHash() {
        const hash = state.view ? "#" + encodeURIComponent(state.view) : "";
        if (location.hash !== hash && typeof history !== "undefined")
          history.replaceState(
            null,
            "",
            location.pathname + location.search + hash,
          );
      }
      const accountLabel = (ac) =>
        (ac.tool === "kimi"
          ? ac.phone || ac.display_name || ac.email
          : ac.email || ac.display_name || ac.phone) || "未提供账号名称";
      const busy = (tool) => state.operations.has(actionTool(tool));
      const canWrite = () =>
        Boolean(
          state.instance && state.trustedID && state.online && !state.fatal,
        );
      function clampPct(value) {
        if (value == null || value === "") return null;
        const n = Number(value);
        return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : null;
      }
      function usedColor(value) {
        const p = clampPct(value);
        return p == null
          ? "transparent"
          : p >= 100
            ? "var(--bad)"
            : p >= 80
              ? "var(--warn)"
              : "var(--ok)";
      }
      function usedText(value) {
        const p = clampPct(value);
        return p == null ? "用量未知" : `已用 ${Math.floor(p)}%`;
      }
      function fmtTime(seconds) {
        if (!seconds) return "";
        const d = new Date(Number(seconds) * 1000);
        if (Number.isNaN(d.getTime())) return "";
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(d);
      }
      function quotaBuckets(ac) {
        const rows = ac.buckets || [];
        return ac.tool === "antigravity"
          ? antigravityBucketIDs.map(
              (id) => rows.find((b) => b.id === id) || { id, used_pct: null },
            )
          : rows;
      }
      function quotaClass(ac) {
        if (
          ac.tool === "antigravity" &&
          ac.class !== "expired" &&
          quotaBuckets(ac).some((b) => clampPct(b.used_pct) == null)
        )
          return "unknown";
        return ac.class || "unknown";
      }
      function quotaNote(ac) {
        const known =
            quotaBuckets(ac).some((b) => clampPct(b.used_pct) != null) ||
            (["ok", "soft", "exhausted"].includes(ac.class) &&
              clampPct(ac.used_pct) != null),
          parts = [];
        if (ac.class === "expired") parts.push("认证已失效，请重新登录。");
        if (
          ac.tool === "antigravity" &&
          quotaBuckets(ac).some((b) => clampPct(b.used_pct) == null)
        )
          parts.push("两组额度信息不完整，暂不自动切换。");
        if (
          ac.quota_stale ||
          ac.last_probe_class === "unknown" ||
          ac.class === "unknown"
        ) {
          parts.push(
            known ? "当前用量未确认，显示历史用量。" : "尚未确认当前用量。",
          );
        }
        if (ac.last_quota_at)
          parts.push("用量记录 " + fmtTime(ac.last_quota_at));
        if (ac.last_probe_at && ac.last_probe_at !== ac.last_quota_at)
          parts.push("最近查询 " + fmtTime(ac.last_probe_at));
        return parts.join(" · ");
      }
      function bucketLabel(id) {
        return (
          {
            auto: "Auto",
            api: "高级模型",
            bot: "Bot",
            daily: "日额度",
            weekly: "周额度",
            monthly: "月额度",
            monthly_code: "月度编程",
            mcp: "月度 MCP",
            "5h": "5 小时",
            weekly_sonnet: "Sonnet 周额度",
            weekly_opus: "Opus 周额度",
            gemini_5h: "5 小时",
            gemini_weekly: "周额度",
            third_party_5h: "5 小时",
            third_party_weekly: "周额度",
            extra_usage: "额外用量",
            "1d": "日额度",
          }[id] || id
        );
      }
      function quotaRow(b) {
        const p = clampPct(b.used_pct),
          label = bucketLabel(b.id);
        return `<div class="quota-row"><div class="quota-label"><span>${attr(label)}</span><span class="quota-value">${usedText(p)}</span></div><div class="bar${p == null ? " empty" : ""}" role="meter" aria-label="${attr(label)}" ${p == null ? 'aria-valuetext="用量未知"' : `aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-valuetext="${usedText(p)}"`}><i style="width:${p ?? 0}%;background:${usedColor(p)}"></i></div><div class="reset-time">${b.resets_at ? "重置 " + attr(fmtTime(b.resets_at)) : "重置时间未知"}</div></div>`;
      }
      function groupStatus(rows, ac) {
        if (rows.some((b) => clampPct(b.used_pct) == null)) return "未知";
        if (ac.quota_stale || ac.class === "unknown" || ac.class === "expired")
          return "历史记录";
        return rows.some((b) => clampPct(b.used_pct) >= 100) ? "受限" : "可用";
      }
      function bucketHTML(ac) {
        let rows = quotaBuckets(ac);
        if (ac.tool === "antigravity")
          return `<div class="quota-groups">${[
            ["Gemini", rows.slice(0, 2)],
            ["第三方模型", rows.slice(2)],
          ]
            .map(
              ([name, items]) =>
                `<section class="quota-group" aria-label="${name}额度"><header><h3>${name}</h3><span class="pill">${groupStatus(items, ac)}</span></header><div class="quota-list">${items.map(quotaRow).join("")}</div></section>`,
            )
            .join(
              "",
            )}</div><p class="rule"><strong>两组额度都耗尽</strong>才自动切换；单组耗尽时保留当前账号。</p>`;
        if (!rows.length)
          rows = [
            {
              id: "总用量",
              used_pct: ["ok", "soft", "exhausted"].includes(ac.class)
                ? ac.used_pct
                : null,
              resets_at: ac.resets_at,
            },
          ];
        const extra = new Set(["weekly_sonnet", "weekly_opus", "extra_usage"]),
          primary = rows.filter((b) => !extra.has(b.id)),
          secondary = rows.filter((b) => extra.has(b.id));
        return `<div class="quota-list">${primary.map(quotaRow).join("")}</div>${secondary.length ? `<details class="details" data-detail="extra-quota"><summary>专项额度与额外用量</summary><div class="quota-list details-content">${secondary.map(quotaRow).join("")}</div><p class="quota-note">这些额度单独展示，不作为自动切换门限。</p></details>` : ""}`;
      }
      function pill(label, tone = "") {
        return `<span class="pill ${tone}">${attr(label)}</span>`;
      }
      function accountStatus(ac) {
        const cls = quotaClass(ac);
        if (ac.class === "expired") return pill("需要重新登录", "error");
        if (ac.quota_stale) return pill("历史额度");
        return pill(
          classNames[cls] || cls,
          cls === "ok"
            ? "ok"
            : ["soft", "exhausted"].includes(cls)
              ? "warn"
              : "",
        );
      }
      function switchNote(tool) {
        const parts = [];
        if (tool.pending_to) {
          const target = (tool.accounts || []).find(
            (a) => a.stable_id === tool.pending_to,
          );
          parts.push(
            "待切换至 " +
              (target ? accountLabel(target) : "已选目标") +
              "，当前账号尚未切换。",
          );
        }
        if (tool.tool === "antigravity") {
          if (tool.busy)
            parts.push("等待桌面 App 和 CLI 会话空闲后，统一切换本机账号。");
          if (tool.pending_to) parts.push("切换前会再次核验两组额度。");
        } else if (tool.tool === "claude") {
          if (tool.managed_unavailable) parts.push("受管会话状态暂时不可读。");
          for (const s of tool.managed || []) {
            if (s.recovery) parts.push(`PID ${s.pid} 需要恢复：${s.recovery}`);
            else if (tool.pending_to && !s.ready)
              parts.push(`PID ${s.pid}：${s.reason || "会话尚未空闲"}`);
          }
        } else if (tool.busy) {
          parts.push(
            tool.tool === "kimi"
              ? "请在对应终端退出 Kimi 会话；仅空闲不会解除阻塞。"
              : tool.tool === "codex"
                ? "ChatGPT 桌面端若在运行，需先退出；Codex CLI 须满足空闲条件后才能切换。"
                : tool.tool === "cursor"
                  ? capability(tool, "desktop_sync").available
                    ? "请先退出 Cursor 桌面端；Cursor CLI 须满足空闲条件后才能切换。"
                    : "Cursor CLI 须满足空闲条件后才能切换；当前实例不管理 Cursor IDE 登录。"
                  : "当前客户端仍在使用，切换前须满足空闲条件。",
          );
        }
        return parts.join(" ");
      }
      function commandHTML(command) {
        return command
          ? `<div class="command"><code>${attr(command)}</code><button class="ghost" data-act="copy-command" data-command="${attr(command)}" aria-label="复制命令">复制</button></div>`
          : "";
      }
      function actionButton(tool, key, label, act, id = "", extra = "") {
        const cap = capability(tool, key),
          disabled = !cap.available || !canWrite() || busy(tool.tool);
        return `<button ${extra} data-act="${act}" data-tool="${attr(tool.tool)}" data-id="${attr(id)}" data-focus="${act}:${attr(id || tool.tool)}" ${disabled ? "disabled" : ""} ${!cap.available ? `title="${attr(cap.reason || "暂不可用")}"` : ""}>${label}</button>`;
      }
      function loginGuidance(tool) {
        const cap = capability(tool, "login");
        if (["codex", "grok"].includes(tool.tool) && cap.available)
          return actionButton(
            tool,
            "login",
            "添加账号",
            "login",
            "",
            'class="primary"',
          );
        return (
          commandHTML(cap.command || capability(tool, "run").command) +
          `<p class="capability-note">${attr(cap.reason || (tool.tool === "antigravity" ? "在 Antigravity App 或原生 CLI 中登录，账号会自动收录。" : "先在官方客户端登录，再收录当前账号。"))}</p>`
        );
      }
      function accountHTML(ac, tool) {
        const readOnly = Boolean(tool.derived_from || ac.derived || ac.desktop);
        const cls = quotaClass(ac);
        return `<button class="ghost mobile-back" data-act="back-to-accounts" data-focus="back-to-accounts">← 返回账号列表</button><div class="detail-heading"><div class="identity"><h2 id="accountTitle" tabindex="-1">${attr(accountLabel(ac))}</h2><div class="identity-meta">${ac.live ? pill("当前账号", "current") : ""}${ac.plan && ac.plan !== "-" ? pill(ac.plan) : ""}${accountStatus(ac)}${ac.desktop ? pill("桌面快照") : ""}${ac.incomplete ? pill("凭据待补齐", "warn") : ""}</div></div></div><div class="detail-actions">${actionButton(tool, "probe", "查询用量", "probe", ac.stable_id)}${!ac.live && !readOnly ? actionButton(tool, "switch", "切换到此账号", "switch", ac.stable_id, 'class="primary"') : ""}${!ac.live && !ac.derived && !tool.derived_from ? `<details class="more" data-detail="account-more"><summary aria-label="此账号的更多操作" data-focus="account-more">更多</summary><div class="more-menu"><button class="danger" data-act="forget" data-tool="${attr(tool.tool)}" data-id="${attr(ac.stable_id)}" data-focus="forget:${attr(ac.stable_id)}" ${!canWrite() || busy(tool.tool) ? "disabled" : ""}>删除已收录账号</button></div></details>` : ""}</div>${bucketHTML(ac)}<p class="quota-note">${attr(quotaNote(ac))}</p>${cls === "expired" ? `<div class="details-content">${loginGuidance(tool)}</div>` : ""}${!capability(tool, "switch").available ? `<p class="capability-note">${attr(capability(tool, "switch").reason || "当前工具不支持账号切换")}</p>` : ""}<details class="details" data-detail="account-details"><summary data-focus="account-details">账号与查询详情</summary><div class="details-content"><dl class="facts"><dt>账号 ID</dt><dd><code>${attr(ac.stable_id)}</code></dd><dt>认证</dt><dd>${ac.class === "expired" ? "已失效" : ac.incomplete ? "信息不完整" : "已收录"}</dd><dt>最近收录</dt><dd>${fmtTime(ac.last_captured_at) || "暂无记录"}</dd><dt>最近查询</dt><dd>${fmtTime(ac.last_probe_at || ac.last_probed_at) || "暂无记录"}</dd><dt>查询来源</dt><dd>${attr(ac.last_probe_source || "暂无记录")}</dd>${ac.stale_cli ? "<dt>CLI</dt><dd>登录快照偏旧，需在官方 CLI 重新登录后收录</dd>" : ""}</dl></div></details>`;
      }
      // Outer navigation and account buttons keep their identity across observations.
      // Only changed detail content is replaced; focus and disclosure state survive it.
      function patchHTML(el, html) {
        if (el._html === html) return;
        const active = document.activeElement,
          focus = el.contains(active) ? active?.dataset?.focus : null;
        const open = new Set(
          Array.from(el.querySelectorAll("details[open][data-detail]")).map(
            (d) => d.dataset.detail,
          ),
        );
        el.innerHTML = html;
        el._html = html;
        for (const d of el.querySelectorAll("details[data-detail]"))
          if (open.has(d.dataset.detail)) d.open = true;
        if (focus) {
          const next = Array.from(el.querySelectorAll("[data-focus]")).find(
            (n) => n.dataset.focus === focus,
          );
          if (next && !next.disabled) next.focus({ preventScroll: true });
        }
      }
      function setNotice(el, text, error = false) {
        if (!el) return;
        el.textContent = text || "";
        el.hidden = !text;
        el.className = "notice" + (error ? " error" : "");
      }
      function message(tool, text, error = false) {
        state.messages.set(actionTool(tool), { text, error });
        renderMessage();
      }
      function renderMessage() {
        const el = $("toolMessage");
        if (el) {
          const value = state.messages.get(actionTool(state.view));
          setNotice(el, value?.text, value?.error);
        }
        if ($("loginDlg").open && ui.login.mode === "picker") {
          const value = state.messages.get(actionTool(ui.login.tool));
          loginMessage(value?.text || "", value?.error);
        }
      }
      function renderConnection() {

          state.envDraft = state.environments.map((e) => ({ ...e }));
        renderEnvironmentRows();
        if (state.environmentsMessage)
          setNotice(
            $("environmentMessage"),
            state.environmentsMessage.text,
            state.environmentsMessage.error,
          );
        else if (state.environmentsError)
          setNotice($("environmentMessage"), state.environmentsError, true);
        patchHTML(
          $("instanceDetails"),
          `<dl class="facts"><dt>名称</dt><dd>${attr(state.instance?.name)}</dd><dt>实例 ID</dt><dd><code>${attr(state.instance?.id)}</code></dd><dt>版本</dt><dd>${attr(state.instance?.version)}</dd><dt>系统</dt><dd>${attr(state.instance?.os)}</dd><dt>管理工具</dt><dd>${attr((state.instance?.managed_tools || []).map(toolTitle).join("、"))}</dd></dl>`,
        );
        $("saveEnvironments").disabled = !canWrite() || busy("environments");
      }
      function renderEnvironmentRows() {
        patchHTML(
          $("environmentRows"),
          state.envDraft
            .map(
              (e, i) =>
                `<div class="environment-row" data-env-row="${i}"><label class="field">显示名称<input name="name-${i}" value="${attr(e.name)}" maxlength="80" required data-env-field="name" data-focus="env-name:${i}"></label><label class="field">访问地址<input type="url" name="url-${i}" value="${attr(e.url)}" placeholder="https://example.com/qswitch/" required data-env-field="url" data-focus="env-url:${i}"></label><label class="field">目标实例 ID<input name="id-${i}" value="${attr(e.id)}" required spellcheck="false" data-env-field="id" data-focus="env-id:${i}" aria-label="目标实例 ID，可在目标环境的环境管理中查看"></label><button type="button" class="ghost danger" data-act="remove-environment" data-index="${i}">移除</button></div>`,
            )
            .join(""),
        );
      }
      function collectEnvironmentDraft() {
        state.envDraft = Array.from(
          $("environmentRows").querySelectorAll("[data-env-row]"),
        ).map((row) =>
          Object.fromEntries(
            Array.from(row.querySelectorAll("[data-env-field]")).map(
              (input) => [input.dataset.envField, input.value.trim()],
            ),
          ),
        );
      }
      function environmentMessage(text, error = false) {
        state.environmentsMessage = { text, error };
        setNotice($("environmentMessage"), text, error);
      }
      async function saveEnvironments(event) {
        event.preventDefault();
        if (busy("environments") || !canWrite()) return;
        collectEnvironmentDraft();
        state.operations.set("environments", { label: "保存目录" });
        state.revision++;
        $("saveEnvironments").disabled = true;
        try {
          const result = await api("api/environments", {
            method: "POST",
            body: { environments: state.envDraft },
            timeout: 20000,
          });
          if (result.instance && result.instance.id !== state.trustedID)
            throw new Error("保存结果来自其他实例。");
          state.revision++;
          state.environments = result.environments || state.envDraft;
          state.envDraft = state.environments.map((e) => ({ ...e }));
          state.envDirty = false;
          state.environmentsError = "";
          renderEnvironmentNav();
          environmentMessage("环境目录已保存；账号与凭据没有跨环境传输。");
        } catch (e) {
          environmentMessage(e.message, true);
        } finally {
          state.operations.delete("environments");
          if ($("saveEnvironments"))
            $("saveEnvironments").disabled = !canWrite();
        }
      }
      function renderAccountPicker() {
        const tools = addableTools();
        if (!tools.some((tool) => tool.tool === ui.login.tool))
          ui.login.tool = tools[0]?.tool || "";
        patchHTML(
          $("addTool"),
          tools
            .map(
              (tool) =>
                `<option value="${attr(tool.tool)}">${attr(toolTitle(tool.tool))}</option>`,
            )
            .join(""),
        );
        $("addTool").value = ui.login.tool;
        $("addTool").disabled = !canWrite() || busy(ui.login.tool);
        const tool = tools.find((entry) => entry.tool === ui.login.tool);
        patchHTML(
          $("addAccountGuidance"),
          tool
            ? `${loginGuidance(tool)}${!["codex", "grok"].includes(tool.tool) ? `<div class="actions">${actionButton(tool, "capture", "收录当前账号", "capture")}</div>${!capability(tool, "capture").available ? `<p class="capability-note">${attr(capability(tool, "capture").reason || "当前环境暂时无法收录此工具")}</p>` : ""}` : ""}`
            : "<p>当前实例没有可添加账号的工具。</p>",
        );
        renderMessage();
      }
      function openAddAccount(opener) {
        if (!canWrite() || !addableTools().length || $("loginDlg").open) return;
        ui.login.mode = "picker";
        ui.login.opener = opener;
        ui.login.focusKey = opener?.dataset?.focus || "add-account";
        ui.login.tool =
          addableTools().find((tool) => tool.tool === state.view)?.tool ||
          addableTools()[0].tool;
        ui.login.id = "";
        $("loginTitle").textContent = "添加账号";
        $("loginHint").textContent =
          "当前环境：" + (state.instance?.name || "");
        $("loginPicker").hidden = false;
        $("loginAuthorization").hidden = true;
        $("loginRetry").hidden = true;
        $("loginCancel").textContent = "关闭";
        loginMessage("");
        renderAccountPicker();
        $("loginDlg").showModal();
        $("addTool").focus();
      }
      async function startLogin(tool, opener) {
        if (!canWrite() || busy(tool)) return;
        const login = ui.login;
        if ($("loginDlg").open && login.mode === "picker") opener = login.opener;
        login.mode = "device";
        $("loginPicker").hidden = true;
        $("loginAuthorization").hidden = false;
        login.generation++;
        const generation = login.generation;
        clearTimeout(login.timer);
        login.id = "";
        login.tool = tool;
        login.opener = opener || login.opener;
        login.focusKey = opener?.dataset?.focus || login.focusKey;
        login.expires = 0;
        login.polling = false;
        state.operations.set(actionTool(tool), { label: "等待账号授权" });
        render();
        $("loginTitle").textContent = `添加 ${toolTitle(tool)} 账号`;
        $("loginHint").textContent =
          "在官方授权页输入一次性代码，当前客户端的登录保持不变。";
        $("loginCode").textContent = "…";
        $("copyLoginCode").disabled = true;
        $("loginUrl").hidden = true;
        $("loginUrl").removeAttribute("href");
        $("loginExpiry").textContent = "";
        $("loginRetry").hidden = true;
        $("loginCancel").textContent = "取消";
        loginMessage("正在申请授权代码…");
        if (!$("loginDlg").open) $("loginDlg").showModal();
        try {
          const r = await api("api/login/" + tool, {
            method: "POST",
            body: {},
            timeout: 25000,
          });
          if (generation !== login.generation) {
            if (r.id)
              await api("api/login/" + tool + "/cancel", {
                method: "POST",
                body: { id: r.id },
              }).catch(() => {});
            return;
          }
          const url = new URL(r.url);
          if (url.protocol !== "https:") throw new Error("官方授权地址无效。");
          login.id = r.id;
          login.expires = Date.parse(r.expires_at);
          if (!Number.isFinite(login.expires))
            throw new Error("服务未返回有效授权期限。");
          $("loginCode").textContent = r.user_code;
          $("copyLoginCode").disabled = false;
          $("loginUrl").href = url.href;
          $("loginUrl").hidden = false;
          loginMessage("等待你在官方页面完成授权…");
          scheduleLoginPoll(generation, 0);
        } catch (e) {
          if (generation !== login.generation) return;
          loginMessage(e.message, true);
          $("loginRetry").hidden = false;
          releaseLoginTool();
        }
      }
      function loginMessage(text, error = false) {
        $("loginMsg").textContent = text;
        $("loginMsg").className = "dialog-status" + (error ? " error" : "");
      }
      function releaseLoginTool() {
        state.operations.delete(actionTool(ui.login.tool));
        render();
      }
      function scheduleLoginPoll(generation, delay = 2000) {
        clearTimeout(ui.login.timer);
        ui.login.timer = setTimeout(() => pollLogin(generation), delay);
      }
      async function pollLogin(generation) {
        const login = ui.login;
        if (generation !== login.generation || !login.id || login.polling)
          return;
        const remaining = Math.ceil((login.expires - Date.now()) / 1000);
        if (remaining <= 0) {
          loginMessage("授权代码已过期，请重新获取。", true);
          $("loginExpiry").textContent = "已过期";
          $("loginUrl").hidden = true;
          $("copyLoginCode").disabled = true;
          $("loginRetry").hidden = false;
          releaseLoginTool();
          return;
        }
        $("loginExpiry").textContent =
          `代码剩余 ${Math.floor(remaining / 60)} 分 ${remaining % 60} 秒有效`;
        login.polling = true;
        let again = true;
        try {
          const r = await api(
            "api/login/" + login.tool + "?id=" + encodeURIComponent(login.id),
            { timeout: 10000 },
          );
          if (generation !== login.generation) return;
          if (r.status === "ok") {
            again = false;
            loginMessage("账号已添加，当前登录保持不变。");
            $("loginCancel").textContent = "完成";
            $("loginExpiry").textContent = "授权完成";
            $("loginUrl").hidden = true;
            $("copyLoginCode").disabled = true;
            releaseLoginTool();
            state.revision++;
            await loadSnapshot();
            if (visibleTools().some((tool) => tool.tool === login.tool))
              selectView(login.tool);
            message(login.tool, "账号已添加，当前登录保持不变。");
          } else if (r.status === "error") {
            again = false;
            loginMessage(r.error || "授权未完成，请重试。", true);
            $("loginRetry").hidden = false;
            releaseLoginTool();
          }
        } catch (e) {
          if (generation === login.generation)
            loginMessage(e.message + " 正在等待连接恢复。", true);
        } finally {
          if (generation === login.generation) {
            login.polling = false;
            if (again) scheduleLoginPoll(generation);
          }
        }
      }
      async function cancelLogin() {
        const login = ui.login;
        const id = login.id,
          tool = login.tool;
        login.generation++;
        clearTimeout(login.timer);
        login.id = "";
        $("loginDlg").close();
        if (login.mode === "device") releaseLoginTool();
        else render();
        restoreFocus(login.opener, login.focusKey);
        if (id)
          try {
            await api("api/login/" + tool + "/cancel", {
              method: "POST",
              body: { id },
              timeout: 10000,
            });
          } catch (e) {
            message(tool, "已关闭授权窗口；取消请求未确认。" + e.message, true);
          }
      }
      async function onClick(event) {
        const nav = event.target.closest("[data-view]");
        if (nav) {
          event.preventDefault();
          selectView(nav.dataset.view);
          return;
        }
        const b = event.target.closest("[data-act]");
        if (!b || b.disabled) return;
        const { act, tool, id } = b.dataset;
        try {
          if (act === "add-account") {
            openAddAccount(b);
            return;
          }
          if (act === "refresh-state") {
            b.disabled = true;
            await connect();
            b.disabled = false;
            return;
          }
          if (act === "select-account") {
            state.selected.set(tool, id);
            render();
            if (window.matchMedia?.("(max-width: 760px)")?.matches) {
              requestAnimationFrame(() => {
                $("accountTitle")?.focus({ preventScroll: true });
                $("accountDetail")?.scrollIntoView({
                  block: "start",
                  behavior: window.matchMedia(
                    "(prefers-reduced-motion: reduce)",
                  ).matches
                    ? "auto"
                    : "smooth",
                });
              });
            }
            return;
          }
          if (act === "back-to-accounts") {
            ui.accountNodes
              .get(state.selected.get(state.view))
              ?.focus({ preventScroll: true });
            $("accountList")?.scrollIntoView({ block: "start" });
            return;
          }
          if (act === "copy-command") {
            const ok = await copyText(b.dataset.command);
            b.textContent = ok ? "已复制" : "请手动复制";
            return;
          }
          if (act === "copy-code") {
            const ok = await copyText($("loginCode").textContent);
            loginMessage(
              ok ? "代码已复制。" : "复制失败，请选中代码手动复制。",
              !ok,
            );
            return;
          }
          if (act === "login") {
            await startLogin(tool, b);
            return;
          }
          if (act === "retry-login") {
            const t = ui.login.tool,
              opener = ui.login.opener;
            await cancelLogin();
            await startLogin(t, opener);
            return;
          }
          if (act === "cancel-login") {
            await cancelLogin();
            return;
          }
          if (act === "cancel-confirm") {
            closeConfirm();
            return;
          }
          if (act === "accept-confirm") {
            const c = closeConfirm();
            if (c) await c.run();
            return;
          }
          if (act === "add-environment") {
            collectEnvironmentDraft();
            state.envDraft.push({ name: "", url: "", id: "" });
            state.envDirty = true;
            renderEnvironmentRows();
            $("environmentRows")
              .lastElementChild?.querySelector("input")
              ?.focus();
            return;
          }
          if (act === "remove-environment") {
            collectEnvironmentDraft();
            state.envDraft.splice(Number(b.dataset.index), 1);
            state.envDirty = true;
            renderEnvironmentRows();
            return;
          }
          if (act === "diagnostics") {
            b.disabled = true;
            const r = await api(
              "api/diagnostics?tool=" + encodeURIComponent(actionTool(tool)),
            );
            const el = $("diagnostics");
            if (el && ui.tool === tool) {
              el.hidden = false;
              el.textContent = "";
              const pre = document.createElement("pre");
              pre.textContent = r.diagnostics || "暂无诊断信息";
              el.appendChild(pre);
            }
            b.disabled = false;
            return;
          }
          if (busy(tool)) return;
          const t = toolView(tool),
            ac = t?.accounts?.find((a) => a.stable_id === id);
          if (!t) return;
          if (act === "capture") {
            const adding = $("loginDlg").open && ui.login.mode === "picker";
            const captured = await mutate(
              tool,
              "收录账号",
              "api/capture",
              { tool: actionTool(tool) },
              (r) => {
                const count = (r.captured || []).length;
                return (
                  (count
                    ? `已收录 ${count} 个账号。`
                    : "未发现可收录的账号。") +
                  (r.warnings?.length ? " " + r.warnings.join("；") : "")
                );
              },
            );
            if (
              adding &&
              captured &&
              visibleTools().some((entry) => entry.tool === tool)
            ) {
              await cancelLogin();
              selectView(tool);
            }
          } else if (act === "probe" || act === "probe-tool") {
            await mutate(
              tool,
              "查询用量",
              "api/probe",
              { tool: actionTool(tool), id: act === "probe" ? id : "" },
              (result) =>
                probeFeedback(result, tool, act === "probe" ? id : ""),
            );
          } else if (act === "auto") {
            await mutate(
              tool,
              "更新自动切换",
              "api/auto",
              { tool: actionTool(tool), enabled: !t.enabled },
              (result) => autoResult(result, tool),
            );
          } else if (act === "switch" && ac) {
            askConfirm({
              title: "切换账号",
              target: accountLabel(ac),
              impact: switchImpact(tool),
              label: "确认切换",
              opener: b,
              run: () =>
                mutate(
                  tool,
                  "切换账号",
                  "api/switch",
                  { tool: actionTool(tool), id, kill_cli: true },
                  () =>
                    tool === "antigravity"
                      ? "Antigravity 本机 App 和 CLI 账号已切换。"
                      : "账号切换已完成。",
                ),
            });
          } else if (act === "forget" && ac) {
            askConfirm({
              title: "删除已收录账号",
              target: accountLabel(ac),
              impact:
                "只从当前实例的加密仓库删除此账号，不退出官方客户端，也不删除对话。",
              label: "删除账号",
              danger: true,
              opener: b,
              run: () =>
                mutate(
                  tool,
                  "删除账号",
                  "api/forget",
                  { tool: actionTool(tool), id },
                  () => "已从本机仓库删除该账号。",
                ),
            });
          }
        } catch (e) {
          if (tool) message(tool, e.message, true);
          else setNotice($("globalNotice"), e.message, true);
          b.disabled = false;
        }
      }
      async function pollOverview() {
        clearTimeout(ui.overviewTimer);
        if (!document.hidden && !state.fatal) {
          if (state.instance) await loadSnapshot();
          else await connect();
        }
        ui.overviewTimer = setTimeout(pollOverview, 15000);
      }
      // qswitch-ui-bootstrap
      document.addEventListener("click", onClick);
      document.addEventListener("input", (e) => {
        if (e.target.closest("#environmentForm")) {
          state.envDirty = true;
          collectEnvironmentDraft();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "addTool") {
          ui.login.tool = e.target.value;
          renderAccountPicker();
        }
      });
      document.addEventListener("submit", (e) => {
        if (e.target.id === "environmentForm") saveEnvironments(e);
      });
      $("loginDlg").addEventListener("cancel", (e) => {
        e.preventDefault();
        cancelLogin();
      });
      $("confirmDlg").addEventListener("cancel", (e) => {
        e.preventDefault();
        closeConfirm();
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) pollOverview();
      });
      window.addEventListener("hashchange", () => {
        state.view = normalizedView(hashView());
        render();
      });
      (async () => {
        await connect();
        try {
          const session = await api("api/session");
          $("logoutForm").hidden = !session.login_required;
        } catch {}
        ui.overviewTimer = setTimeout(pollOverview, 15000);
      })();
    </script>
  </body>
</html>
