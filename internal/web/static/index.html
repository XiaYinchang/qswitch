<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qswitch</title>
<style>
  :root {
    --bg: #111318;
    --card: #1a1d24;
    --line: #2a2e38;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --ok: #3dd68c;
    --soft: #e6b84d;
    --bad: #f07178;
    --live: #7aa2f7;
    --btn: #2b313c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header p { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  main { padding: 18px 24px 40px; display: grid; gap: 22px; }
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .sec-head h2 {
    font-size: 15px;
    margin: 0;
    display: flex;
    gap: 10px;
    align-items: baseline;
    min-width: 0;
    flex-wrap: wrap;
  }
  .meta { color: var(--muted); font-size: 12px; font-weight: 400; }
  .actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    align-items: center;
  }
  button {
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    line-height: 1.3;
    white-space: nowrap;
  }
  button:hover { border-color: #4a5160; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.danger { color: var(--bad); }
  button.primary { border-color: var(--live); color: var(--live); }
  button.ghost {
    background: transparent;
    border-color: transparent;
    color: #b4bac2;
  }
  button.ghost:hover {
    color: var(--text);
    background: var(--btn);
    border-color: var(--line);
  }
  button.ghost.danger:hover { color: var(--bad); border-color: #5c2a30; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .card.live { border-color: #3d4c7a; }
  .card.desktop { opacity: 0.78; }
  .who {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
  }
  .who > div:first-child { min-width: 0; }
  .email { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .id { color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 2px; }
  .bar {
    height: 8px;
    background: #2a2e38;
    border-radius: 99px;
    overflow: hidden;
    margin: 8px 0 4px;
  }
  .bar > i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--ok);
    transition: width .35s ease, background-color .35s ease;
  }
  .bar.empty > i { width: 0; background: transparent; }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .stats .rem, .bucket .rem {
    margin-left: auto;
    text-align: right;
    white-space: nowrap;
    min-width: 5.6em;
  }
  .bucket .when {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    min-width: 9em;
    text-align: right;
  }
  .buckets { margin-top: 8px; display: grid; gap: 6px; }
  .bucket {
    display: grid;
    grid-template-columns: 72px 1fr auto auto;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .bucket .name { color: var(--text); }
  .bucket .bar { margin: 0; height: 6px; }
  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 1px 7px;
    border-radius: 99px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .badge.ok { color: var(--ok); border-color: #245c42; }
  .badge.soft { color: var(--soft); border-color: #5c4a20; }
  .badge.exhausted, .badge.expired { color: var(--bad); border-color: #5c2a30; }
  .badge.live { color: var(--live); border-color: #3d4c7a; }
  .msg {
    color: var(--muted);
    font-size: 13px;
    min-height: 1.2em;
    text-align: right;
  }
  .msg.err { color: var(--bad); }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
  .quota-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  dialog {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 12px;
    padding: 18px 20px;
    max-width: 440px;
  }
  dialog::backdrop { background: #0008; }
  .code {
    font: 22px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    margin: 10px 0;
  }
  a { color: var(--live); }
  @media (max-width: 720px) {
    header, .sec-head, .stats { flex-wrap: wrap; }
    .header-right, .msg { width: 100%; text-align: left; }
    .sec-head .actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
    .who { align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>qswitch</h1>
    <p>本机账号余量。token 不会出现在这个页面上。</p>
  </div>
  <div class="header-right">
    <p class="msg" id="msg"></p>
    <button id="reload" data-act="reload-all">刷新</button>
  </div>
</header>
<main id="root"></main>
<dialog id="loginDlg">
  <h3 id="loginTitle">Device Code 加号</h3>
  <p id="loginHint">用浏览器打开链接，输入一次性代码。不要在当前客户端里换号或 logout。</p>
  <p><a id="loginUrl" target="_blank" rel="noopener"></a></p>
  <div class="code" id="loginCode"></div>
  <p class="msg" id="loginMsg">等你在浏览器里确认…</p>
  <div class="actions">
    <button class="ghost" id="loginCancel">取消</button>
  </div>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const msg = (t, err) => { const el = $("msg"); el.textContent = t || ""; el.className = "msg" + (err ? " err" : ""); };
const api = (path, opt) => fetch(path, Object.assign({ cache: "no-store", headers: { "Content-Type": "application/json" } }, opt)).then(async r => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
});
const clsLabel = { ok: "正常", soft: "接近用尽", exhausted: "已用尽", expired: "票失效", unknown: "未查到" };
function clampPct(n) {
  if (n == null || n === "") return null;
  const x = Number(n);
  if (!Number.isFinite(x)) return null;
  return Math.max(0, Math.min(100, x));
}
function mixRGB(a, b, t) {
  const u = Math.max(0, Math.min(1, t));
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * u)},${Math.round(a[1] + (b[1] - a[1]) * u)},${Math.round(a[2] + (b[2] - a[2]) * u)})`;
}
function usedColor(used) {
  const p = clampPct(used);
  if (p == null) return "transparent";
  const g = [61, 214, 140], y = [230, 184, 77], r = [240, 113, 120];
  if (p <= 50) return mixRGB(g, g, 0);
  if (p <= 80) return mixRGB(g, y, (p - 50) / 30);
  return mixRGB(y, r, (p - 80) / 20);
}
function usedText(used, tool) {
  if (used == null) return "用量未知";
  return `已用 ${["grok", "kimi", "zcode"].includes(tool) ? Math.floor(used) : used.toFixed(0)}%`;
}
function barStyle(used) {
  if (used == null) return "";
  return `width:${used}%;background:${usedColor(used)}`;
}
function fmtTime(sec) {
  if (!sec) return "";
  const d = new Date(sec * 1000);
  if (Number.isNaN(d.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function whenText(ac) {
  const ts = Number(ac.resets_at) || (ac.class === "exhausted" ? Number(ac.cooling_until) : 0) || 0;
  if (!ts) return "";
  const label = ac.class === "exhausted" ? "冷却到" : "重置于";
  return `${label} ${fmtTime(ts)}`;
}
function bucketLabel(id) {
  if (id === "auto") return "Auto";
  if (id === "api") return "高级模型";
  if (id === "bot") return "Bot";
  if (id === "daily") return "日额度";
  if (id === "weekly") return "周额度";
  if (id === "monthly") return "月额度";
  if (id === "monthly_code") return "月度编程";
  if (id === "mcp") return "月度 MCP";
  if (id === "5h") return "5小时";
  if (id === "1d") return "日额度";
  return id;
}
function bucketHTML(ac) {
  const rows = ac.buckets || [];
  if (!rows.length) return "";
  return `<div class="buckets">${rows.map(b => {
    const used = clampPct(b.used_pct);
    const when = b.resets_at ? fmtTime(b.resets_at) : "";
    return `<div class="bucket"><span class="name">${attr(bucketLabel(b.id))}</span><div class="bar"><i style="${barStyle(used)}"></i></div><span class="rem">${usedText(used, ac.tool)}</span>${when ? `<span class="when">${when}</span>` : `<span class="when"></span>`}</div>`;
  }).join("")}</div>`;
}
function toolTitle(t) {
  if (t === "codex") return "ChatGPT / Codex";
  if (t === "grok") return "Grok";
  if (t === "cursor") return "Cursor";
  if (t === "grokbot") return "Grok Bot";
  if (t === "devin") return "Devin CLI";
  if (t === "zcode") return "ZCode 订阅";
  if (t === "kimi") return "Kimi Code";
  return t;
}
function attr(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function toolActions(tool) {
  const t = attr(tool.tool === "grokbot" ? "cursor" : tool.tool);
  let html = `<button data-act="probe-tool" data-tool="${t}">刷新用量</button>`;
  if (tool.tool === "grokbot") return html;
  html += `<button data-act="capture" data-tool="${t}">收录</button>`;
  if (tool.tool === "codex") html += `<button class="primary" data-act="login-codex">加号</button>`;
  if (tool.tool === "grok") html += `<button class="primary" data-act="login-grok">加号</button>`;
  return html;
}
function accountLabel(ac) {
  if (ac.tool === "kimi") return ac.phone || ac.display_name || ac.email || ac.stable_id;
  return ac.email || ac.display_name || ac.phone || ac.stable_id;
}
function quotaNote(ac) {
  const known = (ac.buckets || []).some(b => clampPct(b.used_pct) != null) ||
    (["ok", "soft", "exhausted"].includes(ac.class) && clampPct(ac.used_pct) != null);
  const parts = [];
  if (ac.class === "expired") parts.push("认证已失效，请重新登录。" + (known ? "显示历史用量。" : ""));
  else if (ac.last_probe_class === "unknown") parts.push("最近查询未能确认用量。" + (known ? "显示历史用量。" : ""));
  else if (ac.class === "unknown") parts.push("尚未确认当前用量。" + (known ? "显示历史用量。" : ""));
  else if (ac.quota_stale && known) parts.push("显示历史用量。");
  if (known && ac.last_quota_at) parts.push(`用量记录 ${fmtTime(ac.last_quota_at)}`);
  if (parts.length && ac.last_probe_at && ac.last_probe_at !== ac.last_quota_at) parts.push(`最近查询 ${fmtTime(ac.last_probe_at)}`);
  return parts.join(" · ");
}
function cardActions(ac, switchable) {
  const t = attr(ac.tool), id = attr(ac.stable_id);
  const bits = [];
  if (!ac.desktop) bits.push(`<button class="ghost" data-act="probe" data-tool="${t}" data-id="${id}">查询</button>`);
  if (ac.derived) return bits.join("");
  if (switchable && !ac.live && !ac.desktop) bits.push(`<button data-act="switch" data-tool="${t}" data-id="${id}">切换</button>`);
  if (!ac.live) bits.push(`<button class="ghost danger" data-act="forget" data-tool="${t}" data-id="${id}">删除</button>`);
  return bits.join("");
}
function render(ov) {
  const root = $("root");
  root.innerHTML = "";
  (ov.tools || []).forEach(tool => {
    const sec = document.createElement("section");
    const flags = [];
    if (tool.auto) flags.push("自动切换开");
    if (tool.busy) flags.push("CLI 占用中");
    if (tool.chatgpt_app) flags.push("ChatGPT.app 在跑");
    if (tool.cursor_app) flags.push("Cursor.app 在跑");
    if (tool.grok_bot_app) flags.push("Grok Bot.app 在跑");
    if (tool.devin_app) flags.push("Devin.app 在跑");
    if (tool.desync) flags.push("桌面/CLI 不一致");
    if (tool.tool === "grokbot") flags.push("随 Cursor 账号");
    if (tool.tool === "zcode") flags.push("桌面订阅 · 在 ZCode 中切换账号");
    sec.innerHTML = `<div class="sec-head">
      <h2>${toolTitle(tool.tool)} <span class="meta">${flags.join(" · ") || "空闲"}</span></h2>
      <div class="actions">${toolActions(tool)}</div>
    </div>`;
    (tool.accounts || []).forEach(ac => {
      const used = ["unknown", "expired"].includes(ac.class) ? null : clampPct(ac.used_pct);
      const card = document.createElement("div");
      const kinds = ["card"];
      if (ac.live) kinds.push("live");
      if (ac.desktop) kinds.push("desktop");
      card.className = kinds.join(" ");
      const badges = [];
      if (ac.live) badges.push(`<span class="badge live">当前</span>`);
      const oldStatus = ac.quota_stale && ["ok", "soft", "exhausted"].includes(ac.class);
      if (!oldStatus) badges.push(`<span class="badge ${attr(ac.class)}">${attr(clsLabel[ac.class] || ac.class)}</span>`);
      if (ac.plan && ac.plan !== "-") badges.push(`<span class="badge">${attr(ac.plan)}</span>`);
      if (ac.stale_cli) badges.push(`<span class="badge">CLI 偏旧</span>`);
      if (ac.desktop) badges.push(`<span class="badge">桌面快照</span>`);
      const acts = cardActions(ac, tool.switchable);
      card.innerHTML = `
        <div class="who">
          <div>
            <div class="email">${attr(accountLabel(ac))} ${badges.join(" ")}</div>
            <div class="id">${attr(ac.stable_id)}</div>
          </div>
          ${acts ? `<div class="actions">${acts}</div>` : ""}
        </div>
        ${ac.buckets && ac.buckets.length
          ? bucketHTML(ac) + (!(ac.buckets || []).some(b => b.resets_at) && whenText(ac) ? `<div class="stats"><span>${whenText(ac)}</span><span></span></div>` : "")
          : `<div class="bar${used == null ? " empty" : ""}"><i style="${barStyle(used)}"></i></div>
        <div class="stats"><span>${whenText(ac)}</span><span class="rem">${usedText(used, ac.tool)}</span></div>`}
        ${quotaNote(ac) ? `<p class="quota-note">${attr(quotaNote(ac))}</p>` : ""}`;
      sec.appendChild(card);
    });
    if (!(tool.accounts || []).length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "还没有收录账号。先在官方客户端登录，再点「收录」。";
      sec.appendChild(p);
    }
    root.appendChild(sec);
  });
}
async function load() {
  try {
    render(await api("/api/overview"));
    msg("");
  } catch (e) { msg(e.message, true); }
}
async function onClick(e) {
  const b = e.target.closest("button");
  if (!b || !b.dataset.act) return;
  const act = b.dataset.act, tool = b.dataset.tool, id = b.dataset.id;
  try {
    if (act === "capture") {
      b.disabled = true;
      const r = await api("/api/capture", { method: "POST", body: JSON.stringify({ tool }) });
      await load();
      msg("已收录 " + (r.captured || []).map(accountLabel).join(", "));
    } else if (act === "reload-all" || act === "probe" || act === "probe-tool") {
      b.disabled = true;
      msg("正在查用量…");
      const body = act === "reload-all" ? {} : { tool, id: act === "probe" ? id : "" };
      const ov = await api("/api/probe", { method: "POST", body: JSON.stringify(body) });
      if (ov && ov.tools) {
        render(ov);
        const uncertain = ov.tools.filter(t => !tool || t.tool === tool).some(t => (t.accounts || []).some(ac => ac.quota_stale));
        msg(uncertain ? "查询完成，部分账号的当前用量未能确认；旧数据已标明。" : "查询完成。", uncertain);
      } else {
        await load();
        if (ov.class === "expired") msg("认证已失效，请重新登录。旧用量已标明。", true);
        else if (!ov.updated) msg("本次未能确认用量，保留上次记录。", true);
        else msg("用量已更新");
      }
      b.disabled = false;
    } else if (act === "forget") {
      if (!confirm("从仓库删掉这个账号？当前登录不会动。")) return;
      b.disabled = true;
      await api("/api/forget", { method: "POST", body: JSON.stringify({ tool, id }) });
      await load();
    } else if (act === "switch") {
      const prompt = {
        codex: "切换到这个账号？会关掉并重启 ChatGPT.app；空闲的 Codex CLI 也会结束。",
        grok: "切换到这个账号？会关掉并重启 Grok Bot.app；空闲的 grok CLI 也会结束。",
        cursor: "切换到这个账号？会关掉并重启 Cursor.app；空闲的 cursor-agent 也会结束。只改登录字段，不碰聊天记录。",
        devin: "切换 Devin CLI 到这个账号？空闲 CLI 会结束，新进程使用新账号。Devin.app 使用独立登录。",
        kimi: "切换 Kimi Code 到这个账号？请先结束正在运行的 Kimi 会话，新进程将使用新账号。",
      }[tool] || "切换到这个账号？空闲的 CLI 会先结束。";
      if (!confirm(prompt)) return;
      b.disabled = true;
      await api("/api/switch", { method: "POST", body: JSON.stringify({ tool, id, kill_cli: true }) });
      await load();
      msg(["kimi", "devin"].includes(tool) ? "已切换。新的 CLI 进程将使用新账号。" : "已切换。对应的 App 会用新号打开。");
    } else if (act === "login-codex" || act === "login-grok") {
      await startLogin(act === "login-grok" ? "grok" : "codex");
    }
  } catch (err) {
    b.disabled = false;
    msg(err.message, true);
  }
}
let loginTimer = null, loginId = "", loginTool = "codex", loginGeneration = 0;
async function startLogin(tool) {
  const generation = ++loginGeneration;
  clearInterval(loginTimer);
  loginId = "";
  loginTool = tool;
  $("loginTitle").textContent = tool === "grok" ? "Grok Device Code 加号" : "ChatGPT Device Code 加号";
  $("loginHint").textContent = tool === "grok"
    ? "用浏览器打开链接，输入一次性代码。不要在当前 grok 里换号，也不要 logout。"
    : "用浏览器打开链接，输入一次性代码。不要在 ChatGPT.app 里换号，也不要 logout。";
  $("loginUrl").removeAttribute("href");
  $("loginUrl").textContent = "";
  $("loginCode").textContent = "";
  $("loginMsg").textContent = "正在向官方申请一次性代码…";
  $("loginDlg").showModal();
  let r;
  try {
    r = await api("/api/login/" + tool, { method: "POST", body: "{}" });
  } catch (e) {
    if (generation === loginGeneration) $("loginMsg").textContent = e.message;
    return;
  }
  if (generation !== loginGeneration) {
    await api("/api/login/" + tool + "/cancel", { method: "POST", body: JSON.stringify({ id: r.id }) }).catch(() => {});
    return;
  }
  loginId = r.id;
  $("loginUrl").href = r.url;
  $("loginUrl").textContent = r.url;
  $("loginCode").textContent = r.user_code;
  $("loginMsg").textContent = "等你在浏览器里确认…";
  loginTimer = setInterval(pollLogin, 2000);
}
async function pollLogin() {
  if (!loginId) return;
  const generation = loginGeneration;
  try {
    const r = await api("/api/login/" + loginTool + "?id=" + encodeURIComponent(loginId));
    if (generation !== loginGeneration) return;
    if (r.status === "ok") {
      clearInterval(loginTimer);
      $("loginDlg").close();
      msg("已加上 " + (r.email || r.stable_id) + "，当前登录没动。");
      load();
    } else if (r.status === "error") {
      clearInterval(loginTimer);
      $("loginMsg").textContent = r.error || "失败";
    }
  } catch (e) { if (generation === loginGeneration) $("loginMsg").textContent = e.message; }
}
async function cancelLogin() {
  ++loginGeneration;
  clearInterval(loginTimer);
  const id = loginId, tool = loginTool;
  loginId = "";
  $("loginDlg").close();
  if (id) await api("/api/login/" + tool + "/cancel", { method: "POST", body: JSON.stringify({ id }) }).catch(() => {});
}
