name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check tagged source
        env:
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
        run: |
          mkdir -p "$HOME"
          go vet ./...
          go test ./...
      - name: Build portable commands
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -buildvcs=false
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            name="qswitch-${GOOS}-${GOARCH}"
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            suffix=''
            if [ "$GOOS" = windows ]; then suffix=.exe; fi
            for command in qswitch qswitchd; do
              go build -trimpath -ldflags "-X qswitch/internal/buildinfo.Version=${GITHUB_REF_NAME}" -o "$stage/$command$suffix" "./cmd/$command"
            done
            cp README.md LICENSE "$stage/"
            if [ "$GOOS" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" *)
            else
              tar -C "$stage" -czf "dist/$name.tar.gz" .
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${args[@]}"
